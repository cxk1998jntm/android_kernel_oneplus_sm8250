name: Build KernelSU-Next Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: "16.0"
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            libelf-dev libssl-dev libncurses-dev \
            python3 unzip wget zip zstd

      - name: Clone Android clang
        run: |
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          echo "Searching for clang toolchain..."
          find clang -type f -name ld.lld -print
          find clang -type f -name clang -print | head -20

      - name: Integrate KernelSU-Next
        run: |
          curl -LSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh \
            | bash

      - name: Prepare toolchain
        run: |
          LLD_PATH=$(find "$GITHUB_WORKSPACE/clang" -type f -name ld.lld | head -1)

          if [ -z "$LLD_PATH" ]; then
            echo "ERROR: ld.lld not found"
            exit 1
          fi

          TOOLCHAIN_BIN=$(dirname "$LLD_PATH")

          echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

          echo "Using toolchain:"
          echo "$TOOLCHAIN_BIN"

          "$TOOLCHAIN_BIN/clang" --version
          "$TOOLCHAIN_BIN/ld.lld" --version

      - name: Prepare config
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/kona-perf_defconfig

          cat arch/arm64/configs/vendor/oplus.config >> out/.config

          echo "CONFIG_KSU=y" >> out/.config

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          grep CONFIG_KSU out/.config || true

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1

      - name: Show outputs
        run: |
          ls -lh out/arch/arm64/boot/ || true
          file out/arch/arm64/boot/Image || true

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus8T-KernelSU-Next-kernel
          path: |
            out/arch/arm64/boot/Image
            out/.config
