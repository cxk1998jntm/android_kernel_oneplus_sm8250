name: Build KernelSU-Next Legacy Manual Hook Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: "16.0"
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            libelf-dev libssl-dev libncurses-dev \
            python3 unzip wget zip zstd

      - name: Download Android 11 clang
        run: |
          git clone --depth=1 \
            --branch llvm-r399163b \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          test -x clang/clang-r383902b/bin/clang
          test -x clang/clang-r383902b/bin/ld.lld

          clang/clang-r383902b/bin/clang --version
          clang/clang-r383902b/bin/ld.lld --version

      - name: Integrate KernelSU-Next legacy
        run: |
          curl -LSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            | bash -s legacy

      - name: Apply manual hooks
        run: |
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, data):
              Path(path).write_text(data)

          # =================================================
          # fs/open.c
          # =================================================
          path = "fs/open.c"
          data = read(path)

          marker = "long do_faccessat(int dfd, const char __user *filename, int mode)"

          if marker not in data:
              raise SystemExit("[FAIL] do_faccessat signature not found")

          if "ksu_handle_faccessat" not in data:
              data = data.replace(
                  marker,
                  """#ifdef CONFIG_KSU
          extern int ksu_handle_faccessat(int *dfd,
                         const char __user **filename_user,
                         int *mode, int *flags);
          #endif

          """ + marker,
                  1
              )

              target = "\tunsigned int lookup_flags = LOOKUP_FOLLOW;"

              if target not in data:
                  target = "    unsigned int lookup_flags = LOOKUP_FOLLOW;"

              if target not in data:
                  raise SystemExit(
                      "[FAIL] lookup_flags declaration not found in do_faccessat"
                  )

              patched = target + """
          #ifdef CONFIG_KSU
              ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          #endif"""

              data = data.replace(target, patched, 1)

              write(path, data)
              print("[OK] patched fs/open.c")
          else:
              print("[SKIP] fs/open.c already contains hook")

          # =================================================
          # fs/exec.c
          # =================================================
          path = "fs/exec.c"
          data = read(path)

          marker = "static int do_execveat_common(int fd, struct filename *filename,"

          if marker not in data:
              raise SystemExit(
                  "[FAIL] do_execveat_common signature not found"
              )

          if "ksu_handle_execveat(" not in data:
              data = data.replace(
                  marker,
                  """#ifdef CONFIG_KSU
          extern bool ksu_execveat_hook __read_mostly;

          extern int ksu_handle_execveat(
                  int *fd,
                  struct filename **filename_ptr,
                  void *argv,
                  void *envp,
                  int *flags);

          extern int ksu_handle_execveat_sucompat(
                  int *fd,
                  struct filename **filename_ptr,
                  void *argv,
                  void *envp,
                  int *flags);
          #endif

          """ + marker,
                  1
              )

              pos = data.find(marker)
              brace = data.find("{", pos)

              if brace == -1:
                  raise SystemExit(
                      "[FAIL] do_execveat_common opening brace not found"
                  )

              insert = """
          #ifdef CONFIG_KSU
              if (unlikely(ksu_execveat_hook))
                  ksu_handle_execveat(
                      &fd, &filename, &argv, &envp, &flags);
              else
                  ksu_handle_execveat_sucompat(
                      &fd, &filename, &argv, &envp, &flags);
          #endif
          """

              data = data[:brace + 1] + insert + data[brace + 1:]

              write(path, data)
              print("[OK] patched fs/exec.c")
          else:
              print("[SKIP] fs/exec.c already contains hook")

          # =================================================
          # fs/read_write.c
          # =================================================
          path = "fs/read_write.c"
          data = read(path)

          marker = (
              "SYSCALL_DEFINE3(read, unsigned int, fd, "
              "char __user *, buf, size_t, count)"
          )

          if marker not in data:
              raise SystemExit(
                  "[FAIL] SYSCALL_DEFINE3(read) not found"
              )

          if "ksu_handle_sys_read" not in data:
              data = data.replace(
                  marker,
                  """#ifdef CONFIG_KSU
          extern bool ksu_vfs_read_hook __read_mostly;

          extern __attribute__((cold)) int ksu_handle_sys_read(
                  unsigned int fd,
                  char __user **buf_ptr,
                  size_t *count_ptr);
          #endif

          """ + marker,
                  1
              )

              body = marker + "\n{"

              if body not in data:
                  raise SystemExit(
                      "[FAIL] read syscall body not found"
                  )

              patched = body + """
          #ifdef CONFIG_KSU
              if (unlikely(ksu_vfs_read_hook))
                  ksu_handle_sys_read(fd, &buf, &count);
          #endif"""

              data = data.replace(body, patched, 1)

              write(path, data)
              print("[OK] patched fs/read_write.c")
          else:
              print("[SKIP] fs/read_write.c already contains hook")

          # =================================================
          # fs/stat.c
          # =================================================
          path = "fs/stat.c"
          data = read(path)

          marker = (
              "int vfs_statx(int dfd, "
              "const char __user *filename, int flags,"
          )

          if marker not in data:
              raise SystemExit(
                  "[FAIL] vfs_statx signature not found"
              )

          if "ksu_handle_stat" not in data:
              data = data.replace(
                  marker,
                  """#ifdef CONFIG_KSU
          extern int ksu_handle_stat(
                  int *dfd,
                  const char __user **filename_user,
                  int *flags);
          #endif

          """ + marker,
                  1
              )

              targets = [
                  "\tunsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;",
                  "    unsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;",
              ]

              target = None

              for candidate in targets:
                  if candidate in data:
                      target = candidate
                      break

              if target is None:
                  raise SystemExit(
                      "[FAIL] vfs_statx lookup_flags line not found"
                  )

              patched = target + """
          #ifdef CONFIG_KSU
              ksu_handle_stat(&dfd, &filename, &flags);
          #endif"""

              data = data.replace(target, patched, 1)

              write(path, data)
              print("[OK] patched fs/stat.c")
          else:
              print("[SKIP] fs/stat.c already contains hook")

          # =================================================
          # kernel/reboot.c
          # =================================================
          path = "kernel/reboot.c"
          data = read(path)

          marker = (
              "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, "
              "unsigned int, cmd,"
          )

          if marker not in data:
              raise SystemExit(
                  "[FAIL] reboot syscall signature not found"
              )

          if "ksu_handle_sys_reboot" not in data:
              data = data.replace(
                  marker,
                  """#ifdef CONFIG_KSU
          extern int ksu_handle_sys_reboot(
                  int magic1,
                  int magic2,
                  unsigned int cmd,
                  void __user **arg);
          #endif

          """ + marker,
                  1
              )

              target = (
                  "if (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))"
              )

              if target not in data:
                  raise SystemExit(
                      "[FAIL] reboot capability check not found"
                  )

              patched = """#ifdef CONFIG_KSU
              if (system_state == SYSTEM_RUNNING)
                  ksu_handle_sys_reboot(
                      magic1, magic2, cmd, &arg);
          #endif

              """ + target

              data = data.replace(target, patched, 1)

              write(path, data)
              print("[OK] patched kernel/reboot.c")
          else:
              print("[SKIP] kernel/reboot.c already contains hook")

          # =================================================
          # Verification
          # =================================================
          print("\n========== Manual Hook Verification ==========")

          checks = {
              "fs/open.c": "ksu_handle_faccessat",
              "fs/exec.c": "ksu_handle_execveat",
              "fs/read_write.c": "ksu_handle_sys_read",
              "fs/stat.c": "ksu_handle_stat",
              "kernel/reboot.c": "ksu_handle_sys_reboot",
          }

          for file, symbol in checks.items():
              txt = read(file)

              if symbol not in txt:
                  raise SystemExit(
                      f"[FAIL] {symbol} missing from {file}"
                  )

              print(f"[OK] {file}: {symbol}")

          print("\n[OK] all manual hooks installed")
          PY

      - name: Prepare toolchain
        run: |
          TOOLCHAIN_BIN="$GITHUB_WORKSPACE/clang/clang-r383902b/bin"

          echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

      - name: Prepare config
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$TOOLCHAIN_BIN:$PATH"

          make O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM_IAS=1 \
            vendor/kona-perf_defconfig

          cat arch/arm64/configs/vendor/oplus.config >> out/.config

          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
          echo "# CONFIG_KSU_KPROBES_HOOK is not set" >> out/.config

          make O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM_IAS=1 \
            olddefconfig

          echo "========== KernelSU config =========="
          grep CONFIG_KSU out/.config || true

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$TOOLCHAIN_BIN:$PATH"

          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM_IAS=1

      - name: Show outputs
        run: |
          echo "========== Boot output directory =========="
          ls -lh out/arch/arm64/boot/ || true

          echo "========== Kernel Image =========="
          file out/arch/arm64/boot/Image || true

          echo "========== KernelSU config =========="
          grep CONFIG_KSU out/.config || true

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus8T-KernelSU-Next-Legacy-ManualHook
          path: |
            out/arch/arm64/boot/Image
            out/.config
