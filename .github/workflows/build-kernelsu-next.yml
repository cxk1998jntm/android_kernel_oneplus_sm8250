name: Build KernelSU-Next Legacy Manual Hook Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: "16.0"
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            libelf-dev libssl-dev libncurses-dev \
            python3 unzip wget zip zstd

      - name: Download Android 11 clang
        run: |
          git clone --depth=1 \
            --branch llvm-r399163b \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          test -x clang/clang-r383902b/bin/clang
          test -x clang/clang-r383902b/bin/ld.lld

          clang/clang-r383902b/bin/clang --version
          clang/clang-r383902b/bin/ld.lld --version

      - name: Integrate KernelSU-Next legacy
        run: |
          curl -LSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            | bash -s legacy

      - name: Apply manual hooks safely
        run: |
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, data):
              Path(path).write_text(data)

          def function_range(data, marker):
              """
              Find one C function beginning at marker and return:
              marker_pos, opening_brace_pos, closing_brace_pos
              """
              start = data.find(marker)
              if start == -1:
                  raise SystemExit(f"[FAIL] function marker not found: {marker}")

              brace = data.find("{", start)
              if brace == -1:
                  raise SystemExit(f"[FAIL] opening brace not found: {marker}")

              depth = 0

              for i in range(brace, len(data)):
                  ch = data[i]

                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1

                      if depth == 0:
                          return start, brace, i

              raise SystemExit(f"[FAIL] closing brace not found: {marker}")

          def insert_before_function(path, marker, declaration):
              data = read(path)

              if declaration.split("(")[0].strip() in data:
                  return data

              pos = data.find(marker)

              if pos == -1:
                  raise SystemExit(
                      f"[FAIL] marker not found for declaration in {path}"
                  )

              data = data[:pos] + declaration + "\n\n" + data[pos:]

              return data

          # ============================================================
          # fs/open.c : do_faccessat
          # ============================================================
          path = "fs/open.c"
          data = read(path)

          marker = (
              "long do_faccessat(int dfd, "
              "const char __user *filename, int mode)"
          )

          if marker not in data:
              raise SystemExit("[FAIL] do_faccessat signature not found")

          if "extern int ksu_handle_faccessat" not in data:
              pos = data.find(marker)

              declaration = """#ifdef CONFIG_KSU
          extern int ksu_handle_faccessat(
                  int *dfd,
                  const char __user **filename_user,
                  int *mode,
                  int *flags);
          #endif

          """

              data = data[:pos] + declaration + data[pos:]

          start, brace, end = function_range(data, marker)

          func = data[start:end + 1]

          if "ksu_handle_faccessat(&dfd" not in func:

              targets = [
                  "\tunsigned int lookup_flags = LOOKUP_FOLLOW;",
                  "    unsigned int lookup_flags = LOOKUP_FOLLOW;",
              ]

              target = None

              for candidate in targets:
                  if candidate in func:
                      target = candidate
                      break

              if target is None:
                  print("\n===== do_faccessat =====")
                  print(func[:1500])
                  raise SystemExit(
                      "[FAIL] do_faccessat lookup_flags not found"
                  )

              hook = target + """
          #ifdef CONFIG_KSU
              ksu_handle_faccessat(
                  &dfd, &filename, &mode, NULL);
          #endif"""

              func = func.replace(target, hook, 1)

              data = data[:start] + func + data[end + 1:]

          write(path, data)

          print("[OK] patched fs/open.c / do_faccessat")

          # ============================================================
          # fs/exec.c : do_execveat_common
          # ============================================================
          path = "fs/exec.c"
          data = read(path)

          marker = (
              "static int do_execveat_common("
              "int fd, struct filename *filename,"
          )

          if marker not in data:
              raise SystemExit(
                  "[FAIL] do_execveat_common signature not found"
              )

          if "extern int ksu_handle_execveat(" not in data:
              pos = data.find(marker)

              declaration = """#ifdef CONFIG_KSU
          extern bool ksu_execveat_hook __read_mostly;

          extern int ksu_handle_execveat(
                  int *fd,
                  struct filename **filename_ptr,
                  void *argv,
                  void *envp,
                  int *flags);

          extern int ksu_handle_execveat_sucompat(
                  int *fd,
                  struct filename **filename_ptr,
                  void *argv,
                  void *envp,
                  int *flags);
          #endif

          """

              data = data[:pos] + declaration + data[pos:]

          start, brace, end = function_range(data, marker)

          func = data[start:end + 1]

          if "ksu_handle_execveat(" not in func:

              hook = """
          #ifdef CONFIG_KSU
              if (unlikely(ksu_execveat_hook))
                  ksu_handle_execveat(
                      &fd, &filename, &argv, &envp, &flags);
              else
                  ksu_handle_execveat_sucompat(
                      &fd, &filename, &argv, &envp, &flags);
          #endif
          """

              local_brace = func.find("{")

              func = (
                  func[:local_brace + 1]
                  + hook
                  + func[local_brace + 1:]
              )

              data = data[:start] + func + data[end + 1:]

          write(path, data)

          print("[OK] patched fs/exec.c / do_execveat_common")

          # ============================================================
          # fs/read_write.c : SYSCALL_DEFINE3(read)
          # ============================================================
          path = "fs/read_write.c"
          data = read(path)

          marker = (
              "SYSCALL_DEFINE3(read, unsigned int, fd, "
              "char __user *, buf, size_t, count)"
          )

          if marker not in data:
              raise SystemExit(
                  "[FAIL] SYSCALL_DEFINE3(read) not found"
              )

          if "extern __attribute__((cold)) int ksu_handle_sys_read" not in data:
              pos = data.find(marker)

              declaration = """#ifdef CONFIG_KSU
          extern bool ksu_vfs_read_hook __read_mostly;

          extern __attribute__((cold)) int ksu_handle_sys_read(
                  unsigned int fd,
                  char __user **buf_ptr,
                  size_t *count_ptr);
          #endif

          """

              data = data[:pos] + declaration + data[pos:]

          start, brace, end = function_range(data, marker)

          func = data[start:end + 1]

          if "ksu_handle_sys_read(fd" not in func:

              # Linux 4.19 read syscall normally declares:
              #
              # struct fd f = fdget_pos(fd);
              # ssize_t ret = -EBADF;
              #
              # Insert immediately before first executable if-statement.
              targets = [
                  "\tif (f.file) {",
                  "    if (f.file) {",
                  "\tif (f.file)",
                  "    if (f.file)",
              ]

              target = None

              for candidate in targets:
                  if candidate in func:
                      target = candidate
                      break

              if target is None:
                  print("\n===== SYSCALL_DEFINE3(read) =====")
                  print(func[:1500])
                  raise SystemExit(
                      "[FAIL] first read() executable statement not found"
                  )

              hook = """#ifdef CONFIG_KSU
              if (unlikely(ksu_vfs_read_hook))
                  ksu_handle_sys_read(fd, &buf, &count);
          #endif

          """ + target

              func = func.replace(target, hook, 1)

              data = data[:start] + func + data[end + 1:]

          write(path, data)

          print("[OK] patched fs/read_write.c / read")

          # ============================================================
          # fs/stat.c : vfs_statx
          # ============================================================
          path = "fs/stat.c"
          data = read(path)

          marker = (
              "int vfs_statx(int dfd, "
              "const char __user *filename, int flags,"
          )

          if marker not in data:
              raise SystemExit(
                  "[FAIL] vfs_statx signature not found"
              )

          if "extern int ksu_handle_stat(" not in data:
              pos = data.find(marker)

              declaration = """#ifdef CONFIG_KSU
          extern int ksu_handle_stat(
                  int *dfd,
                  const char __user **filename_user,
                  int *flags);
          #endif

          """

              data = data[:pos] + declaration + data[pos:]

          start, brace, end = function_range(data, marker)

          func = data[start:end + 1]

          if "ksu_handle_stat(&dfd" not in func:

              targets = [
                  "\tunsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;",
                  "    unsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;",
              ]

              target = None

              for candidate in targets:
                  if candidate in func:
                      target = candidate
                      break

              if target is None:
                  print("\n===== vfs_statx =====")
                  print(func[:1800])
                  raise SystemExit(
                      "[FAIL] vfs_statx lookup_flags not found"
                  )

              hook = target + """
          #ifdef CONFIG_KSU
              ksu_handle_stat(&dfd, &filename, &flags);
          #endif"""

              func = func.replace(target, hook, 1)

              data = data[:start] + func + data[end + 1:]

          write(path, data)

          print("[OK] patched fs/stat.c / vfs_statx")

          # ============================================================
          # kernel/reboot.c : reboot
          # ============================================================
          path = "kernel/reboot.c"
          data = read(path)

          marker = (
              "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, "
              "unsigned int, cmd,"
          )

          if marker not in data:
              raise SystemExit(
                  "[FAIL] reboot syscall signature not found"
              )

          if "extern int ksu_handle_sys_reboot(" not in data:
              pos = data.find(marker)

              declaration = """#ifdef CONFIG_KSU
          extern int ksu_handle_sys_reboot(
                  int magic1,
                  int magic2,
                  unsigned int cmd,
                  void __user **arg);
          #endif

          """

              data = data[:pos] + declaration + data[pos:]

          start, brace, end = function_range(data, marker)

          func = data[start:end + 1]

          if "ksu_handle_sys_reboot(" not in func:

              targets = [
                  "\tif (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))",
                  "    if (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))",
                  "if (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))",
              ]

              target = None

              for candidate in targets:
                  if candidate in func:
                      target = candidate
                      break

              if target is None:
                  print("\n===== reboot syscall =====")
                  print(func[:1800])
                  raise SystemExit(
                      "[FAIL] reboot capability check not found"
                  )

              hook = """#ifdef CONFIG_KSU
              if (system_state == SYSTEM_RUNNING)
                  ksu_handle_sys_reboot(
                      magic1, magic2, cmd, &arg);
          #endif

          """ + target

              func = func.replace(target, hook, 1)

              data = data[:start] + func + data[end + 1:]

          write(path, data)

          print("[OK] patched kernel/reboot.c / reboot")

          # ============================================================
          # Verification
          # ============================================================
          print("\n========== Manual Hook Verification ==========")

          checks = [
              ("fs/open.c",
               marker if False else
               "long do_faccessat(int dfd, const char __user *filename, int mode)",
               "ksu_handle_faccessat(&dfd"),

              ("fs/exec.c",
               "static int do_execveat_common(int fd, struct filename *filename,",
               "ksu_handle_execveat("),

              ("fs/read_write.c",
               "SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)",
               "ksu_handle_sys_read(fd"),

              ("fs/stat.c",
               "int vfs_statx(int dfd, const char __user *filename, int flags,",
               "ksu_handle_stat(&dfd"),

              ("kernel/reboot.c",
               "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,",
               "ksu_handle_sys_reboot("),
          ]

          for file, func_marker, hook_symbol in checks:

              txt = read(file)

              start, brace, end = function_range(txt, func_marker)

              func = txt[start:end + 1]

              if hook_symbol not in func:
                  raise SystemExit(
                      f"[FAIL] {hook_symbol} not inside target function in {file}"
                  )

              print(
                  f"[OK] {file}: hook is inside target function"
              )

          print("\n[OK] all manual hooks installed in correct functions")
          PY

      - name: Show patched function excerpts
        run: |
          echo "========== do_faccessat =========="
          grep -n -A30 -B5 \
            "long do_faccessat" fs/open.c | head -60 || true

          echo "========== do_execveat_common =========="
          grep -n -A35 -B5 \
            "static int do_execveat_common" fs/exec.c | head -70 || true

          echo "========== read syscall =========="
          grep -n -A30 -B5 \
            "SYSCALL_DEFINE3(read" fs/read_write.c | head -60 || true

          echo "========== vfs_statx =========="
          grep -n -A30 -B5 \
            "int vfs_statx" fs/stat.c | head -60 || true

          echo "========== reboot =========="
          grep -n -A40 -B5 \
            "SYSCALL_DEFINE4(reboot" kernel/reboot.c | head -80 || true

      - name: Prepare toolchain
        run: |
          TOOLCHAIN_BIN="$GITHUB_WORKSPACE/clang/clang-r383902b/bin"

          echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

      - name: Prepare config
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$TOOLCHAIN_BIN:$PATH"

          make O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM_IAS=1 \
            vendor/kona-perf_defconfig

          cat arch/arm64/configs/vendor/oplus.config >> out/.config

          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
          echo "# CONFIG_KSU_KPROBES_HOOK is not set" >> out/.config

          make O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM_IAS=1 \
            olddefconfig

          echo "========== KernelSU config =========="
          grep CONFIG_KSU out/.config || true

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$TOOLCHAIN_BIN:$PATH"

          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM_IAS=1

      - name: Show outputs
        run: |
          echo "========== Boot output directory =========="
          ls -lh out/arch/arm64/boot/ || true

          echo "========== Kernel Image =========="
          file out/arch/arm64/boot/Image || true

          echo "========== KernelSU config =========="
          grep CONFIG_KSU out/.config || true

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus8T-KernelSU-Next-Legacy-ManualHook
          path: |
            out/arch/arm64/boot/Image
            out/.config
